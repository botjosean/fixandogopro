<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14213D">
<title>Fix &amp; Go · Recibo de equipo</title>
<link rel="icon" type="image/png" href="/logo/logo-mark-32.png">
<style>
:root{--navy:#14213D;--sea:#0E7C86;--mango:#F2A541;--bg:#F5F8F9;--card:#fff;--ink:#14213D;--mut:#4A5873;--line:#D8E1E6;--ok:#1E8E3E;--bad:#C62828;--warn:#FDF0DC}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1526;--card:#14213D;--ink:#EEF3F8;--mut:#B4C2D3;--line:#2A3B5C;--warn:#3A2E14}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 40px}
header{background:var(--navy);color:#fff;padding:14px 16px}
header .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:38px;height:38px;border-radius:10px}
header b{font-size:1.1rem}
.lang{margin-left:auto;display:flex;gap:6px}
.lang button{min-height:44px;min-width:48px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;font-weight:700;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--navy)}
h1{font-size:1.5rem;line-height:1.2;margin:20px 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.eq{background:var(--sea);color:#fff;border-radius:16px;padding:12px 16px;margin:0 0 12px}
.eq small{opacity:.9;display:block}
.eq b{font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
ul.t{margin:0;padding:0;list-style:none}
ul.t li{display:flex;gap:10px;margin:0 0 10px;font-size:.97rem;line-height:1.45}
ul.t li::before{content:"✓";color:var(--ok);font-weight:800;flex:none}
.key{background:var(--warn);border:1.5px solid var(--mango);border-radius:14px;padding:12px 14px;margin:6px 0 0;font-size:.97rem;line-height:1.45}
label{display:block;font-weight:700;margin:12px 0 6px}
input[type=text],input[type=email]{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
.btn{display:block;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--mango);color:#14213D;font:800 1.15rem system-ui;cursor:pointer;margin-top:4px}
.btn[disabled]{opacity:.6;cursor:default}
.msg{margin-top:10px;font-weight:700}
.msg.err{color:var(--bad)}
.done{text-align:center;padding:26px 16px}
.done .ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:34px}
.fine{color:var(--mut);font-size:.82rem;margin-top:10px;line-height:1.4}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<header><div class="in"><img src="/logo/logo-mark-192.png" alt=""><b>Fix &amp; Go</b>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-l="es" aria-pressed="true">ES</button><button type="button" data-l="en" aria-pressed="false">EN</button></div></div></header>
<main class="wrap" id="app"></main>
<script src="/config.js?v=8"></script>
<script>
const qs = new URLSearchParams(location.search);
let lang = qs.get("l") === "en" ? "en" : (qs.get("l") === "es" ? "es" : (/^es/i.test(navigator.language) ? "es" : "en"));
const T = {
  es:{ title:"Autorización para recoger tu equipo", sub:"Léelo y toca el botón. Es rápido.", eq:"Equipo", eqPh:"¿Qué equipo? (p. ej. PS5 con control)", name:"Tu nombre", email:"Correo para tu copia", optional:"opcional",
    terms:[
      "Autorizo a Fix & Go a recoger mi equipo, revisarlo y darme un diagnóstico. Puede tomar fotos de su estado.",
      "El equipo es mío (o tengo permiso del dueño) y no tiene bloqueos de cuentas ajenas.",
      "Nada se repara sin que yo apruebe antes la cotización. Si el diagnóstico tiene costo, me avisan antes.",
      "Se recibe tal como está. Fix & Go no responde por fallas o daños que ya tenía. Yo respaldé mis datos y no responde por su pérdida.",
      "Si Fix & Go daña algo por su culpa, responde hasta el valor del equipo, hasta donde la ley lo permita.",
      "Me avisan por mensaje o correo al contacto que dejé."],
    key:"<b>Equipo no retirado:</b> cuando esté listo o rechace la reparación, tengo 30 días para retirarlo. Luego se guarda 60 días más, con un segundo aviso. Si aun así no lo retiro, puede considerarse abandonado y Fix & Go puede reciclarlo, donarlo o venderlo para recuperar costos, según la ley aplicable.",
    go:"Acepto y firmo", sending:"Enviando…", errFill:"Escribe tu nombre y el equipo.", errNet:"No pudimos enviarlo. Intenta de nuevo o escríbenos por WhatsApp.",
    fine:"Al tocar el botón, mi nombre queda como mi firma electrónica, con el mismo valor que una firma en papel. Este acuerdo se rige por las leyes de Alabama.",
    okH:"¡Listo, gracias!", okP:"Recibimos tu firma. Ya podemos recoger tu equipo. Si dejaste tu correo, te llega una copia." },
  en:{ title:"Authorization to pick up your equipment", sub:"Read it and tap the button. It's quick.", eq:"Equipment", eqPh:"What equipment? (e.g. PS5 with controller)", name:"Your name", email:"Email for your copy", optional:"optional",
    terms:[
      "I authorize Fix & Go to pick up my equipment, inspect it and give me a diagnosis. It may take photos of its condition.",
      "The equipment is mine (or I have the owner's permission) and has no locks tied to someone else's accounts.",
      "Nothing is repaired unless I approve the quote first. If the diagnosis has a cost, I'm told before it's charged.",
      "It is received as-is. Fix & Go is not responsible for faults or damage it already had. I backed up my data and it is not responsible for data loss.",
      "If Fix & Go damages something through its own fault, it is responsible up to the value of the equipment, as far as the law allows.",
      "I'm notified by text or email at the contact I left."],
    key:"<b>Unclaimed equipment:</b> when it's ready or I decline the repair, I have 30 days to pick it up. It is then stored 60 more days, with a second notice. If I still don't pick it up, it may be treated as abandoned and Fix & Go may recycle, donate or sell it to recover costs, as allowed by applicable law.",
    go:"I agree and sign", sending:"Sending…", errFill:"Enter your name and the equipment.", errNet:"We couldn't send it. Try again or message us on WhatsApp.",
    fine:"By tapping the button, my name becomes my electronic signature, with the same value as a paper signature. This agreement is governed by Alabama law.",
    okH:"All set, thank you!", okP:"We received your signature. We can now pick up your equipment. If you left your email, you'll get a copy." }
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const st = { name: (qs.get("n") || "").slice(0, 80), phone: (qs.get("p") || "").replace(/\D/g, "").slice(-10), email: "", items: (qs.get("e") || "").slice(0, 300), sent: false };

function render(){
  const t = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  const app = document.getElementById("app");
  if (st.sent){ app.innerHTML = `<div class="card done"><div class="ck" aria-hidden="true">✓</div><h1>${t.okH}</h1><p>${t.okP}</p><p class="fine">Fix &amp; Go · fixandgopro.com</p></div>`; return; }
  const needName = st.name.trim().length < 3, needEq = !st.items.trim();
  app.innerHTML = `<h1>${t.title}</h1><p class="sub">${t.sub}</p>
  ${needEq ? `<div class="card"><label for="eqi" style="margin-top:0">${t.eq}</label><input type="text" id="eqi" placeholder="${esc(t.eqPh)}" maxlength="300" autocomplete="off" value="${esc(st.items)}"></div>` : `<div class="eq"><small>${t.eq}</small><b>${esc(st.items)}</b></div>`}
  <div class="card"><ul class="t">${t.terms.map(x => `<li>${esc(x)}</li>`).join("")}</ul><div class="key">${t.key}</div></div>
  <form class="card" id="f" novalidate>
    ${needName ? `<label for="nm" style="margin-top:0">${t.name}</label><input type="text" id="nm" autocomplete="name" maxlength="80" value="${esc(st.name)}">` : `<div style="font-weight:700;margin-bottom:8px">${esc(st.name)}</div>`}
    <label for="em" style="margin-top:${needName ? 12 : 0}px">${t.email} <small style="font-weight:400;color:var(--mut)">(${t.optional})</small></label><input type="email" id="em" autocomplete="email" inputmode="email" maxlength="120" value="${esc(st.email)}">
    <input class="hp" type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div style="height:14px"></div><button class="btn" type="submit" id="go">${t.go}</button><div class="msg" id="ms" role="status" aria-live="polite"></div>
    <div class="fine">${t.fine}</div>
  </form>`;
  const $ = id => document.getElementById(id);
  app.querySelectorAll("input").forEach(i => i.addEventListener("input", () => { if ($("nm")) st.name = $("nm").value; if ($("eqi")) st.items = $("eqi").value; st.email = $("em").value; }));
  $("f").addEventListener("submit", async e => {
    e.preventDefault(); const ms = $("ms"); ms.className = "msg"; ms.textContent = "";
    if ($("nm")) st.name = $("nm").value; if ($("eqi")) st.items = $("eqi").value; st.email = $("em").value;
    const name = st.name.trim(), items = st.items.trim();
    if (name.length < 3 || !items){ ms.className = "msg err"; ms.textContent = t.errFill; return; }
    const go = $("go"); go.disabled = true; go.textContent = t.sending;
    try{
      if (!CONFIG.ENDPOINT) throw new Error("no endpoint");
      const r = await fetch(CONFIG.ENDPOINT, { method: "POST", body: JSON.stringify({ type: "consent", lang, name, signature: name, phone: st.phone, email: st.email.trim(), items, agree: true, agree2: true, terms: t.terms.concat([t.key.replace(/<[^>]+>/g, "")]), ua: navigator.userAgent.slice(0, 200), v: "2", hp: $("hp").value }) });
      const j = await r.json(); if (!j.ok) throw new Error(j.error || "fail");
      st.sent = true; render(); window.scrollTo(0, 0);
    }catch(err){ go.disabled = false; go.textContent = t.go; ms.className = "msg err"; ms.textContent = t.errNet; }
  });
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.l; render(); }));
render();
</script>
</body>
</html>
