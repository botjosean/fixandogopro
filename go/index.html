<link rel="icon" type="image/png" sizes="192x192" href="/logo/logo-mark-192.png">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --sea:#0E7C86; --sea-d:#0A5E66; --tint:#E3F2F3; --mango:#F2A541; --mango-t:#FDF0DC;
  --paper:#F6F9FA; --card:#FFFFFF; --line:#E3EAEE; --text:#14213D; --muted:#56637A;
  --sms:#2FB344; --wa:#1FA855; --fb:#0866FF; --rec:#E5484D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:none){
  :root:not([data-theme="light"]){
    --paper:#0D1728; --card:#15223A; --line:#24365A; --text:#EEF3F7; --muted:#A6B4C9;
    --tint:#123B45; --mango-t:#3A2C14; --navy:#EEF3F7;
  }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
html.lock{overflow:hidden}
body{margin:0;background:var(--paper);color:var(--text);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand,.disp{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;font-size:16px;color:var(--text)}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px;border-radius:12px}
.sheet:focus-visible{outline:none}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
@media (min-width:820px){.wrap{max-width:760px}}

header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:1.4rem;line-height:1;text-decoration:none;letter-spacing:-.02em;white-space:nowrap}
.brand img{display:block;height:32px;width:32px;flex:none}
.brand picture{display:block;flex:none}
.brand .bt span{color:var(--mango)}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{color:var(--muted);font-weight:700;font-size:.82rem;padding:7px 12px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--sea);color:#fff}

.hero{background:var(--sea);color:#fff;border-radius:26px 26px 26px 6px;padding:28px 22px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-56px;bottom:-66px;width:170px;height:170px;border-radius:50%;background:var(--mango)}
.hero h1{font-weight:800;font-size:clamp(2rem,8.2vw,3.1rem);line-height:.98;letter-spacing:-.03em;margin:0 0 10px;max-width:12ch;position:relative;z-index:1}
.hero p{margin:0;max-width:30ch;position:relative;z-index:1}
.zone{display:flex;gap:10px;align-items:center;margin:12px 0 0;padding:12px 14px;border-radius:16px;background:var(--mango-t);font-weight:700;font-size:.93rem}
.zone .i{color:var(--mango);width:22px;height:22px}

.search{display:flex;align-items:center;gap:10px;margin:16px 0 14px;background:var(--card);border:1.5px solid var(--line);
  border-radius:16px;padding:0 14px;transition:border-color .15s}
.search:focus-within{border-color:var(--sea)}
.search .i{color:var(--muted);width:20px;height:20px}
.search input{flex:1;border:0;background:none;padding:14px 0;outline:none;-webkit-appearance:none;appearance:none;min-width:0}

/* categorías desplegables */
.cats{display:flex;flex-direction:column;gap:10px}
.cat{background:var(--card);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;transition:border-color .2s}
.cat-h{display:flex;align-items:center;gap:14px;width:100%;padding:16px;scroll-margin-top:12px}
.ib{width:48px;height:48px;border-radius:15px;background:var(--tint);color:var(--sea);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.ct{flex:1;min-width:0}
.ct b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.12rem;line-height:1.15;letter-spacing:-.01em}
.ct small{display:block;color:var(--muted);font-size:.88rem;margin-top:3px;line-height:1.3}
.n{font-size:.78rem;font-weight:700;color:var(--muted);background:var(--paper);border-radius:999px;padding:3px 9px;flex:none}
.chev{color:var(--muted);transition:transform .25s;width:22px;height:22px}
.cat.open{border-color:var(--sea)}
.cat.open .cat-h{background:var(--sea);color:#fff}
.cat.open .ct small{color:rgba(255,255,255,.85)}
.cat.open .ib{background:var(--mango);color:#14213D}
.cat.open .n{background:rgba(255,255,255,.18);color:#fff}
.cat.open .chev{transform:rotate(180deg);color:#fff}
.cat-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.cat.open .cat-b{grid-template-rows:1fr}
.cat-b>div{overflow:hidden;min-height:0}

.list{list-style:none;margin:0;padding:6px 8px 8px}
.list li:not([hidden])~li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;border-radius:14px;min-height:60px;transition:background .12s}
.row:active{background:var(--tint)}
@media (hover:hover){.row:hover{background:var(--tint)}}
.ri{color:var(--sea);width:22px;height:22px}
.row span{flex:1;min-width:0}
.row b{display:block;font-size:.99rem;line-height:1.3}
.row small{display:block;color:var(--muted);font-size:.86rem;line-height:1.3;margin-top:2px}
.row .pr{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:999px;background:rgba(14,124,134,.12);color:var(--sea);font-style:normal;font-weight:800;font-size:.78rem}
.row .tag{display:block;font-size:.72rem;font-weight:700;color:var(--sea);margin-bottom:1px}
.go{width:30px;height:30px;padding:6px;border-radius:50%;background:var(--mango);color:#14213D;stroke-width:2.4}
.hot{margin:0 0 14px}
.hot-l{margin:0 0 8px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hot-c{-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:2px 18px 4px;scroll-padding-inline:18px;scroll-snap-type:x proximity}
.hot-c::-webkit-scrollbar{display:none}
.hotb{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:.9rem;white-space:nowrap;scroll-snap-align:start;transition:border-color .15s,transform .12s}
.hotb:active{transform:scale(.96)}
@media (hover:hover){.hotb:hover{border-color:var(--sea)}}
.hotb .i{width:20px;height:20px;padding:3px;box-sizing:content-box;border-radius:50%;background:var(--mango);color:#14213D;stroke-width:2}
.hotb:first-child .i{background:var(--rec);color:#fff}
.results{background:var(--card);border:1.5px solid var(--line);border-radius:22px}
.empty{color:var(--muted);padding:6px 4px}

.bar{position:sticky;bottom:0;z-index:5;padding:14px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:18px;
  background:linear-gradient(to top,var(--paper) 70%,transparent)}
.bar .row2{display:flex;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:10px;text-decoration:none;font-weight:700;border-radius:18px;
  min-height:58px;padding:0 18px;font-size:1.03rem;transition:transform .12s ease,opacity .15s}
.btn:active{transform:scale(.97)}
#leave{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}   /* se puede mantener pulsado para grabar */
.btn[disabled]{opacity:.6;pointer-events:none}
.main{flex:1;background:var(--navy);color:var(--paper)}
@media (prefers-color-scheme:none){:root:not([data-theme="light"]) .main{background:var(--mango);color:#14213D}}
.round{width:58px;padding:0;background:var(--sea);color:#fff}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:4px 0 20px}

/* hoja */
.scrim{position:fixed;inset:0;background:rgba(8,16,30,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:28px 28px 0 0;max-height:92vh;max-height:92dvh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateY(105%);visibility:hidden;
  transition:transform .34s cubic-bezier(.2,.8,.2,1);padding:0 0 calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(8,16,30,.2)}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none;visibility:visible}
@media (min-width:820px){
  .sheet{left:50%;right:auto;bottom:50%;width:560px;border-radius:28px;transform:translate(-50%,calc(50% + 40px));opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .open .sheet{transform:translate(-50%,50%);opacity:1}
  .grab{display:none!important}
}
.grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.sh-top{display:flex;gap:14px;align-items:flex-start;padding:16px 20px 4px}
.sh-top .ib{width:56px;height:56px;border-radius:18px;background:var(--mango);color:#14213D}
.sh-top .ib .i{width:28px;height:28px}
.sh-top h3{margin:2px 0 2px;font-size:1.38rem;line-height:1.1;letter-spacing:-.02em}
.sh-top p{margin:0;color:var(--muted);font-size:.93rem;line-height:1.35}
.x{margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.x .i{width:20px;height:20px}
.sh-body{padding:14px 20px 0}
.lbl{display:block;font-weight:700;font-size:.9rem;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:.9rem;min-height:42px}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.chip .i{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
/* apartar cita: días y franjas libres */
.pick{margin:-4px 0 16px}
.pick .ph{font-size:.86rem;color:var(--muted);margin:0 0 8px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;min-width:60px;padding:8px 6px;border-radius:16px;border:1.5px solid var(--line);text-align:center;font-weight:700;line-height:1.15}
.dchip small{display:block;font-size:.72rem;color:var(--muted);text-transform:capitalize}
.dchip b{display:block;font-size:1.2rem}
.frs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.fchip{padding:9px 4px;border-radius:14px;border:1.5px solid var(--line);text-align:center;font-weight:700;font-size:.92rem;min-height:54px;line-height:1.2}
.fchip small{display:block;font-size:.74rem;color:var(--muted);font-weight:700}
.dchip[aria-pressed="true"],.fchip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.dchip[aria-pressed="true"] small,.fchip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.dchip:disabled,.fchip:disabled{opacity:.42;cursor:default}
.pick .wait{color:var(--muted);font-size:.88rem;padding:10px 0}
.segc{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:16px;padding:4px;margin-bottom:12px}
.segc button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:12px;font-weight:700;font-size:.95rem;color:var(--muted)}
.segc button .i{width:20px;height:20px}
.segc button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(8,16,30,.12)}
.recbox{display:flex;align-items:center;gap:16px;background:var(--paper);border-radius:18px;padding:16px;margin-bottom:12px}
.recbtn{width:72px;height:72px;border-radius:50%;background:var(--mango);color:#14213D;display:grid;place-items:center;flex:none;position:relative;transition:transform .12s}
.recbtn:active{transform:scale(.95)}
.recbtn .i{width:30px;height:30px}
.recbtn.on{background:var(--rec);color:#fff}
.recbtn.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--rec);opacity:.5;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}
.recinfo{flex:1;min-width:0}
.recinfo b{display:block;font-family:"Bricolage Grotesque",system-ui;font-size:1.5rem;line-height:1}
.recinfo small{display:block;color:var(--muted);font-size:.86rem;margin-top:4px}
.recinfo audio{width:100%;height:36px;margin-top:6px}
.link{color:var(--sea);font-weight:700;font-size:.88rem;text-decoration:underline;margin-top:6px}
textarea,.in{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;-webkit-appearance:none;appearance:none}
textarea{min-height:104px;resize:vertical;margin-bottom:12px}
textarea:focus,.in:focus{outline:none;border-color:var(--sea)}
.two{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;margin-bottom:14px}
.send{width:100%;background:var(--sea);color:#fff}
.status{font-size:.88rem;margin:10px 0 0;text-align:center}
.status.err{color:var(--rec)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;font-weight:700;margin:20px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.direct{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.direct.n4{grid-template-columns:repeat(4,1fr)}
@media (max-width:359px){.direct.n5{grid-template-columns:repeat(6,1fr);row-gap:12px}.direct.n5 a{grid-column:span 2}.direct.n5 a:nth-child(4){grid-column:2/span 2}}
.direct a{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-decoration:none;font-size:.7rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.direct a span{width:100%;max-width:54px;aspect-ratio:1;border-radius:18px;display:grid;place-items:center;color:#fff;transition:transform .12s}
.direct a:active span{transform:scale(.94)}
.direct a small{font-size:inherit;white-space:nowrap}
.d-sms span{background:var(--sms)} .d-tel span{background:var(--navy);color:var(--paper)!important} .d-wa span{background:var(--wa)} .d-fb span{background:var(--fb)} .d-mail span{background:var(--sea)}
.done{text-align:center;padding:26px 20px 10px}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.done .ok .i{width:34px;height:34px;stroke-width:2.6}
.done h3{margin:0 0 6px;font-size:1.5rem;letter-spacing:-.02em}
.done p{margin:0 0 18px;color:var(--muted)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-motion:no-preference){.hero{animation:rise .45s ease-out both}@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}}

/* ---- diseño: color por categoría, sombras cálidas ---- */
[data-k=casa]{--c1:#DDF0F2;--c2:#0E7C86;--c3:#0E7C86}
[data-k=tramites]{--c1:#FCEBCB;--c2:#9A5A08;--c3:#B26A0B}
[data-k=tech]{--c1:#E3EAFB;--c2:#3B5BDB;--c3:#3B5BDB}
[data-k=negocio]{--c1:#F6E1F0;--c2:#A6318A;--c3:#A6318A}
[data-k=viajes]{--c1:#DDF3E4;--c2:#1E8E3E;--c3:#1E8E3E}
[data-k=auto]{--c1:#FDE4D8;--c2:#C2410C;--c3:#C2410C}
/* oferta de una categoría (p. ej. 20% en mecánica) */
.ct .promo{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:9px;background:var(--mango);color:#14213D;font-style:normal;font-weight:800;font-size:.76rem;line-height:1.2}
.hero .promo{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;background:var(--mango);color:#14213D;font-weight:800;font-size:.86rem;position:relative;z-index:1}
/* aviso flotante de la oferta: encima de la barra de abajo, no ocupa espacio; se cierra con la X */
.toast{position:absolute;left:0;right:0;bottom:calc(100% - 6px);display:flex;align-items:center;gap:12px;padding:10px 8px 10px 10px;background:var(--card);border:1.5px solid var(--c3);border-radius:20px;
  box-shadow:0 18px 36px -18px rgba(63,45,20,.6);transform:translateY(14px);opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s .35s}
.toast.on{transform:none;opacity:1;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.toast .tgo{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.toast .ib{width:44px;height:44px;border-radius:14px;background:var(--c3);color:#fff}
.toast b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1rem;line-height:1.15}
.toast b em{font-style:normal;background:var(--mango);color:#14213D;border-radius:8px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.toast small{display:block;color:var(--muted);font-size:.82rem;line-height:1.25;margin-top:2px}
.toast .x{width:40px;height:40px;margin:0}

:root{--paper:#FBF8F2;--line:#EBE3D6;--tint:#F2EBDD}
.hero{background:linear-gradient(135deg,#0E7C86 0%,#0A626B 100%);box-shadow:0 28px 48px -30px rgba(14,124,134,.85)}
.search,.hotb,.cat,.results,.zone{box-shadow:0 14px 30px -22px rgba(63,45,20,.45)}
.cat .ib{background:var(--c1);color:var(--c2)}
.cat.open{border-color:var(--c3)}
.cat.open .cat-h{background:var(--c3);color:#fff}
.cat.open .ib{background:rgba(255,255,255,.25);color:#fff}
.row .ri{width:38px;height:38px;padding:8px;box-sizing:border-box;border-radius:12px;background:var(--c1);color:var(--c2)}
.row .pr{background:var(--c1);color:var(--c2)}
.n{background:#F2EBDD}

/* ---- nota de voz: mantener pulsado, ondas y reproductor propio ---- */
.recbtn{width:84px;height:84px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-shadow:0 14px 26px -14px rgba(242,165,65,.9)}
.recbtn .i{width:34px;height:34px}
.recbtn.on{box-shadow:0 14px 26px -14px rgba(229,72,77,.9)}
.recbox{align-items:center;background:var(--tint);border:1.5px solid var(--line)}
.recbox.rec{border-color:var(--rec);background:#FFF1EE}
.recinfo b{font-size:1.7rem}
.wave{display:flex;align-items:center;gap:3px;height:0;margin-top:0;overflow:hidden;opacity:0;transition:height .2s,opacity .2s,margin .2s}
.recbox.rec .wave{height:38px;margin-top:8px;opacity:1}
.wave i{flex:1;max-width:6px;height:100%;background:var(--rec);border-radius:3px;transform:scaleY(.1);transition:transform .07s linear}
.wave.fake i{animation:wv .9s ease-in-out infinite alternate}
.wave.fake i:nth-child(3n){animation-delay:.15s}.wave.fake i:nth-child(3n+1){animation-delay:.3s}
@keyframes wv{from{transform:scaleY(.15)}to{transform:scaleY(.85)}}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--sea);animation:dt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.play{display:flex;align-items:center;gap:10px;margin-top:8px}
.play button{width:44px;height:44px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;flex:none}
.play button .i{width:20px;height:20px}
.pbar{flex:1;height:8px;border-radius:99px;background:rgba(20,33,61,.12);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--sea);border-radius:99px}
#txWrap{margin-bottom:12px}
#txWrap textarea{min-height:88px;background:#fff}
.hint{color:var(--muted);font-size:.84rem;margin:6px 0 0}
.fielderr{color:var(--rec);font-weight:700;font-size:.9rem;margin:-6px 0 12px}
.in.bad{border-color:var(--rec);box-shadow:0 0 0 3px rgba(229,72,77,.15)}
@media (prefers-reduced-motion:reduce){.wave.fake i,.dots i{animation:none}}
.micerr{color:var(--rec);font-weight:700}
.recinfo small{overflow-wrap:anywhere}

/* Aviso de la oferta (p. ej. mecánica −20%): sale a los 2.5 s, se cierra con la X y no vuelve a salir en 3 días */
let toastT = null;
function promoToast(){
  const el = document.getElementById("toast"), k = cats().find(x => S[x][lang].promo);
  let seen = 0; try{ seen = +localStorage.getItem("promoX") || 0; }catch(e){}
  if (!k || seg === k || Date.now() - seen < 3*864e5){ el.classList.remove("on"); return; }
  const c = S[k][lang], m = (c.promo.match(/\d+%/) || [""])[0];
  el.dataset.k = k;
  el.innerHTML = `<button type="button" class="tgo"><span class="ib">${ico(CAT_ICON[k])}</span><span><b>${esc(T[lang].tag[k] || c.t)}${m?`<em>−${m}</em>`:""}</b><small>${esc(c.promo)}</small></span></button>
    <button type="button" class="x" aria-label="${esc(T[lang].close)}">${ico("close")}</button>`;
  const hide = () => { el.classList.remove("on"); try{ localStorage.setItem("promoX", Date.now()); }catch(e){} };

  el.querySelector(".tgo").onclick = () => { hide(); if (openCat !== k) toggleCat(k); else document.querySelector(`.cat[data-k="${k}"] .cat-h`).scrollIntoView({behavior:"smooth",block:"start"}); };
  if (!el.classList.contains("on")){ clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("on"), 2500); }
}
function onClick(e){

  const h = e.target.closest(".cat-h");

function toggleCat(k){
  openCat = openCat===k ? null : k;

    const o = c.dataset.k===openCat;

function localDays(){ const out = []; for (let i = 0; i < 14; i++){ const d = new Date(); d.setDate(d.getDate()+i); out.push({d:localYmd(d), f:{manana:1,tarde:1,noche:1}}); } return out; }
function loadSlots(){
  if (slotsData || slotsLoading) return;
  slotsLoading = fetch(CONFIG.ENDPOINT, {method:"POST", body:JSON.stringify({type:"slots"})}).then(r=>r.json())

function renderPick(){

const phDigits = v => { let d = String(v||"").replace(/\D/g,""); if (d.length > 10 && d[0] === "1") d = d.slice(1); return d.slice(-10); };
const isMail = v => { v = String(v||""); return /@/.test(v) || (/[a-z]/i.test(v) && v.replace(/\D/g,"").length < 10); };   // "@" o letras sin 10 números -> correo
const okMail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||"").trim());
const phFmt = d => d.length <= 3 ? d : d.length <= 6 ? `(${d.slice(0,3)}) ${d.slice(3)}` : `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
/* sonidos y vibración del micrófono */
let sfxCtx = null;
function sfx(kind){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      sfxCtx = sfxCtx || new AC(); if (sfxCtx.state === "suspended") sfxCtx.resume();
      const seq = {start:[[660,0,.09],[880,.1,.13]], stop:[[880,0,.09],[587,.1,.15]], done:[[784,0,.1],[1047,.11,.17]], sent:[[523,0,.1],[659,.11,.1],[784,.22,.2]]}[kind];
      const t0 = sfxCtx.currentTime + .01;
      seq.forEach(([f,dl,len])=>{ const o = sfxCtx.createOscillator(), g = sfxCtx.createGain(); o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0+dl); g.gain.linearRampToValueAtTime(.2, t0+dl+.012); g.gain.exponentialRampToValueAtTime(.0001, t0+dl+len);
        o.connect(g); g.connect(sfxCtx.destination); o.start(t0+dl); o.stop(t0+dl+len+.03); });
    }
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(kind==="start" ? 25 : kind==="stop" ? [15,40,15] : 12); }catch(e){}
}

function fillSheet(){
  const t = T[lang], s = svc();
  const voice = canVoice(), mode = voice ? st.mode : "text";
  const subDefault = voice ? t.leaveSub : t.leaveSubNoVoice;
  const head = `<span class="grab" aria-hidden="true"></span>
    <div class="sh-top"><span class="ib">${ico(s?s.ic:"msg")}</span>
      <div><h3 id="shTitle">${esc(s?s.name:t.leaveTitle)}</h3><p>${esc(s?(s.sub||subDefault):subDefault)}</p></div>
      <button type="button" class="x" id="x" aria-label="${t.close}">${ico("close")}</button></div>`;
  if (st.sent){
    sheet.innerHTML = head + `<div class="done"><div class="ok">${ico(st.cita?"cal":"check")}</div><h3>${esc(t.doneT(st.name))}</h3><p>${st.cita ? esc(t.doneCita(citaLabel(st.cita))) : t.doneP}</p>
      <button type="button" class="btn send" id="doneBtn">${t.close}</button></div>`;
    sheet.querySelector("#x").onclick = closeSheet; sheet.querySelector("#doneBtn").onclick = closeSheet; return;
  }
  const directRow = `<div class="direct n${order().length}" id="direct">${order().map(k=>`<a class="d-${k}" data-c="${k}"${k==="wa"||k==="fb"?' target="_blank" rel="noopener"':""}><span>${ico(k==="tel"?"call":k)}</span><small>${t[k]}</small></a>`).join("")}</div>`;
  sheet.innerHTML = head + `<div class="sh-body">
    <p class="lbl">${t.quick}</p>
    ${directRow}
    <p class="or">${t.or}</p>
    <p class="lbl">${t.when}</p>
    <div class="chips">${t.chips.map((c,j)=>`<button type="button" class="chip" data-j="${j}" aria-pressed="${j===st.when}">${c}</button>`).join("")}${canPick()?`<button type="button" class="chip" data-j="3" aria-pressed="${st.when===3}">${ico("cal")}${t.pickDay}</button>`:""}</div>
    <div class="pick" id="pick" ${st.when===3?"":"hidden"}></div>
    ${voice?`<div class="segc" role="tablist">
      <button type="button" role="tab" data-m="voice" aria-selected="${mode==="voice"}">${ico("mic")}${t.voice}</button>
      <button type="button" role="tab" data-m="text" aria-selected="${mode==="text"}">${ico("pen")}${t.write}</button></div>`:""}
    <div id="pVoice" ${mode==="voice"?"":"hidden"}>
      <div class="recbox" id="recbox">
        <button type="button" class="recbtn" id="rec" aria-label="${t.hold}">${ico("mic")}</button>
        <div class="recinfo"><b id="recT">0:00</b><small id="recS">${t.hold}</small>
          <div class="wave" id="wave" aria-hidden="true">${"<i></i>".repeat(26)}</div><div id="recP"></div></div></div>
      <div id="txWrap" hidden><label class="lbl" for="tx">${t.check}</label><textarea id="tx" rows="3" aria-label="${esc(t.check)}">${esc(st.text)}</textarea><p class="hint" id="txHint" hidden>${t.txFail}</p></div>
    </div>
    <div id="pText" ${mode==="text"?"":"hidden"}><textarea id="txt" placeholder="${esc(t.ph)}" aria-label="${esc(t.write)}">${esc(st.text)}</textarea></div>
    <p class="lbl">${t.reach}</p>
    <div class="two">
      <input class="in" id="nm" type="text" autocomplete="given-name" placeholder="${esc(t.name)}" aria-label="${esc(t.name)}" value="${esc(st.name)}">
      <input class="in" id="ph" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="80" placeholder="${esc(t.phone)}" aria-label="${esc(t.phone)}" value="${esc(st.phone)}">
    </div>
    <p class="fielderr" id="phErr" role="alert" hidden></p>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="button" class="btn send" id="send">${ico("msg")}<span>${t.send}</span></button>
    <p class="status" id="status" role="status"></p>
  </div>`;
  if (st.audio) showRecDone();
  updateLinks();
  const $ = id => sheet.querySelector(id);
  $("#x").onclick = closeSheet;
  $(".chips").onclick = e=>{ const c = e.target.closest(".chip"); if (!c) return;
    st.when = st.when===+c.dataset.j ? -1 : +c.dataset.j;
    if (st.when!==3) st.cita = null;
    sheet.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", String(+x.dataset.j===st.when))); renderPick(); updateLinks(); };
  $("#pick").onclick = e=>{
    const dc = e.target.closest(".dchip"); if (dc && !dc.disabled){ st.cday = dc.dataset.d; st.cita = null; renderPick(); updateLinks(); return; }
    const fc = e.target.closest(".fchip"); if (fc && !fc.disabled){ st.cita = {d:st.cday, f:fc.dataset.f}; renderPick(); updateLinks(); status(""); }
  };
  renderPick();
  if (voice) $(".segc").onclick = e=>{ const b = e.target.closest("[data-m]"); if (!b) return; setMode(b.dataset.m); };
  bindRec($("#rec"));
  $("#txt").oninput = e=>{ st.text = e.target.value; const tx = $("#tx"); if (tx) tx.value = st.text; updateLinks(); };
  $("#tx").oninput = e=>{ st.text = e.target.value; $("#txt").value = st.text; updateLinks(); };
  $("#nm").oninput = e=>{ st.name = e.target.value; };
  $("#ph").oninput = e=>{ const el = e.target;
    if (isMail(el.value)){ st.phone = el.value.trim(); }                     // correo: se deja tal cual
    else { const del = /^delete/.test(e.inputType||""), before = phDigits(st.phone||"");
      let d = phDigits(el.value); if (del && d === before) d = d.slice(0,-1);   // borrar un guion o parentesis borra el número anterior
      st.phone = phFmt(d); if (el.value !== st.phone){ el.value = st.phone; try{ el.setSelectionRange(st.phone.length, st.phone.length); }catch(_){} } }
    el.classList.remove("bad"); $("#phErr").hidden = true; };
  $("#ph").onchange = e=>{ if (!isMail(e.target.value)) e.target.value = st.phone = phFmt(phDigits(e.target.value)); else st.phone = e.target.value = e.target.value.trim(); };
  $("#send").onclick = send;
}
function setMode(m){
  st.mode = m;
  sheet.querySelectorAll(".segc [data-m]").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.m===m)));
  sheet.querySelector("#pVoice").hidden = m!=="voice"; sheet.querySelector("#pText").hidden = m!=="text";
}
function updateLinks(){ const m = textMsg(); sheet.querySelectorAll("#direct a").forEach(a=>a.href = links[a.dataset.c](m)); }
function status(msg, err){ const s = sheet.querySelector("#status"); if (s){ s.textContent = msg||""; s.className = "status"+(err?" err":""); } }

let actx = null, raf = 0, pressT = 0, player = null;
function startWave(ms){
  const bars = [...sheet.querySelectorAll("#wave i")], wv = sheet.querySelector("#wave");
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(ms), an = actx.createAnalyser(); an.fftSize = 64; src.connect(an);
    const data = new Uint8Array(an.frequencyBinCount);
    const loop = ()=>{ an.getByteFrequencyData(data);
      bars.forEach((b,i)=>{ const v = data[Math.min(data.length-1, Math.floor(i*data.length/bars.length))]/255; b.style.transform = `scaleY(${Math.max(.1, Math.min(1, v*1.25))})`; });
      raf = requestAnimationFrame(loop); };
    loop();
  }catch(e){ wv.classList.add("fake"); }
}
function stopWave(){ cancelAnimationFrame(raf); try{ actx && actx.close(); }catch(e){} actx = null; sheet.querySelectorAll("#wave i").forEach(b=>b.style.transform=""); const w = sheet.querySelector("#wave"); if (w) w.classList.remove("fake"); }
function stopPlayer(){ if (player){ try{ player.pause(); }catch(e){} player = null; } }
let held = false, sawPointer = false;
function bindRec(b){
  const toggle = ()=>{ if (rec && rec.state==="recording") rec.stop(); else startRec(); };
  b.oncontextmenu = e=>e.preventDefault();
  b.onpointerdown = e=>{
    sawPointer = true; e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(_){}
    if (rec && rec.state==="recording"){ rec.stop(); pressT = 0; held = false; return; }   // segundo toque: parar
    pressT = Date.now(); held = true; sfx("start"); startRec();
  };
  const up = ()=>{ held = false; if (rec && rec.state==="recording" && pressT && Date.now()-pressT > 650) rec.stop(); else if (rec && rec.state==="recording") sheet.querySelector("#recS").textContent = T[lang].tapstop; pressT = 0; };
  b.onpointerup = up; b.onpointercancel = up;
  b.onclick = e=>{ if (!sawPointer){ if (!(rec && rec.state==="recording")) sfx("start"); toggle(); } };            // navegadores sin eventos de puntero
  b.onkeydown = e=>{ if (e.key==="Enter" || e.key===" "){ e.preventDefault(); if (!(rec && rec.state==="recording")) sfx("start"); toggle(); } };
}
function micFail(err){
  const t = T[lang], S = sel => sheet.querySelector(sel);
  const b = S("#rec"), box = S("#recbox"); if (!b) return;
  b.classList.remove("on"); b.innerHTML = ico("mic"); box.classList.remove("rec");
  S("#recT").textContent = "0:00";
  S("#recS").innerHTML = `<span class="micerr">${t.micHelp}</span> <button type="button" class="link" id="useTxt">${t.useText}</button>`;
  S("#useTxt").onclick = ()=>setMode("text");
}
async function startRec(){
  const t = T[lang], b = sheet.querySelector("#rec"), box = sheet.querySelector("#recbox");
  if (micBusy || (rec && rec.state==="recording")) return;
  stopPlayer();
  if (st.audio){ URL.revokeObjectURL(st.audio.url); st.audio = null; st.aid = ""; sheet.querySelector("#recP").innerHTML = ""; }
  const owner = st; micBusy = true;
  // respuesta inmediata: el boton reacciona al instante aunque el navegador tarde en dar el micrófono
  b.classList.add("on"); b.innerHTML = ico("stop"); box.classList.add("rec"); sheet.querySelector("#txWrap").hidden = true; status("");
  sheet.querySelector("#recS").textContent = t.prep; sheet.querySelector("#recT").textContent = "0:00";
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ micBusy = false; if (st===owner) micFail(e); return; }
  micBusy = false;
  if (st!==owner){ stream.getTracks().forEach(x=>x.stop()); return; }
  await new Promise(r=>setTimeout(r, 260));   // deja terminar el "beep" de inicio para que no quede en la grabación
  if (st!==owner){ stream.getTracks().forEach(x=>x.stop()); return; }
  let mr, mime = "";
  try{
    mime = ["audio/webm;codecs=opus","audio/mp4","audio/webm"].find(m=>window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    mr = rec = new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
  }catch(e){ stream.getTracks().forEach(x=>x.stop()); micFail(e); return; }
  const chunks = [], ms = stream, t0 = Date.now(); let secs = 0;
  rec.ondataavailable = e=>{ if (e.data.size) chunks.push(e.data); };
  rec.onstop = ()=>{
    clearInterval(tick); stopWave(); ms.getTracks().forEach(x=>x.stop());
    if (st!==owner) return;
    sfx("stop");
    const blob = new Blob(chunks, {type: mr.mimeType || mime || "audio/webm"});
    b.classList.remove("on"); b.innerHTML = ico("mic"); box.classList.remove("rec");
    if (secs < .6){ sheet.querySelector("#recT").textContent = "0:00"; sheet.querySelector("#recS").textContent = t.hold; return; }
    st.audio = {blob, url:URL.createObjectURL(blob), mime:blob.type, dur:Math.max(1, Math.round(secs))};
    transcribe(owner);
  };
  rec.start(250);
  sheet.querySelector("#recS").textContent = held ? t.release : t.tapstop;
  startWave(ms);
  tick = setInterval(()=>{ secs = (Date.now()-t0)/1000; sheet.querySelector("#recT").textContent = fmt(secs); if (secs>=90 && mr.state==="recording") mr.stop(); }, 200);
}
async function transcribe(owner){
  const t = T[lang], S = sel => sheet.querySelector(sel);
  S("#recT").textContent = fmt(st.audio.dur);
  S("#recS").innerHTML = `${t.typing}<span class="dots"><i></i><i></i><i></i></span>`; S("#recP").innerHTML = ""; S("#rec").disabled = true;
  let ok = false, text = "";
  try{
    const ac = new AbortController(), to = setTimeout(()=>ac.abort(), 15000);
    const r = await fetch(CONFIG.ENDPOINT, {method:"POST", signal:ac.signal, body:JSON.stringify({type:"transcribe", mime:st.audio.mime, audio:await b64(st.audio.blob)})});
    clearTimeout(to); const j = await r.json(); ok = !!j.ok; text = (j.text||"").trim(); if (ok && j.aid) st.aid = j.aid;
  }catch(e){}
  if (st!==owner) return;
  S("#rec").disabled = false;
  if (text){ st.text = text; st.tx = 1; }
  sfx("done"); showRecDone(ok && !!text);
}
function showRecDone(good){
  const t = T[lang], S = sel => sheet.querySelector(sel), d = st.audio.dur;
  S("#recT").textContent = fmt(d); S("#recS").textContent = t.recDone;
  S("#recP").innerHTML = `<div class="play"><button type="button" id="pl" aria-label="${t.play}"><svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg></button><span class="pbar"><i id="pg"></i></span></div><button type="button" class="link" id="redo">${t.redo}</button>`;
  S("#redo").onclick = ()=>{ stopPlayer(); startRec(); };
  const pl = S("#pl"), pg = S("#pg");
  const icoPlay = '<svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg>', icoPause = '<svg class="i" viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor" stroke="none"/></svg>';
  pl.onclick = ()=>{
    if (player && !player.paused){ player.pause(); pl.innerHTML = icoPlay; pl.setAttribute("aria-label", t.play); return; }
    if (!player){ player = new Audio(st.audio.url); player.ontimeupdate = ()=>{ pg.style.width = Math.min(100, player.currentTime/d*100) + "%"; }; player.onended = ()=>{ pl.innerHTML = icoPlay; pg.style.width = "0"; player = null; }; }
    player.play().catch(()=>{}); pl.innerHTML = icoPause; pl.setAttribute("aria-label", t.pause);
  };
  S("#txWrap").hidden = false; S("#tx").value = st.text || ""; S("#txHint").hidden = !!good;
  updateLinks();
  const snd = S("#send"); if (snd && snd.scrollIntoView) snd.scrollIntoView({block:"nearest", behavior:"smooth"});
}
const b64 = blob => new Promise((ok,ko)=>{ const r = new FileReader(); r.onload = ()=>ok(String(r.result).split(",")[1]); r.onerror = ko; r.readAsDataURL(blob); });

async function send(){
  const t = T[lang], s = svc(), btn = sheet.querySelector("#send");
  const mail = isMail(st.phone), phone = mail ? "" : phDigits(st.phone), email = mail ? (st.phone||"").trim() : "", mode = canVoice() ? st.mode : "text";
  const hasMsg = mode==="voice" ? !!st.audio : !!(st.text||"").trim();
  const voiceMsg = mode==="voice" && !!st.audio;   // con cita apartada, la nota de voz es opcional
  if (mail ? !okMail(email) : phone.length<10){
    const ph = sheet.querySelector("#ph"), pe = sheet.querySelector("#phErr");
    pe.textContent = t.needPhone; pe.hidden = false; ph.classList.add("bad");
    ph.scrollIntoView({block:"center", behavior:"smooth"}); ph.focus({preventScroll:true}); return;
  }
  if (st.when===3 && !st.cita){ status(t.needCita, true); const p = sheet.querySelector("#pick"); if (p) p.scrollIntoView({block:"center", behavior:"smooth"}); return; }
  if (!hasMsg && !st.cita){ status(t.needMsg, true); return; }
  if (!CONFIG.ENDPOINT){ location.href = links[order()[0]](textMsg() + (st.name?` — ${st.name}`:"") + ` (${st.phone})`); return; }
  btn.disabled = true; btn.lastElementChild.textContent = t.sending; status("");
  const slowT = setTimeout(()=>status(t.slow), 3500);
  try{
    const payload = { v:1, lang, zone:zk, service: s?s.name:t.general, line: st.k??"", when: whenText(), cita: st.when===3 ? st.cita : null,
      name:(st.name||"").trim().slice(0,80), phone, email, text:(st.text||"").trim().slice(0,2000), tx:(voiceMsg && st.tx) ? 1 : 0,
      hp: sheet.querySelector("#hp").value, mime: voiceMsg?st.audio.mime:"", dur: voiceMsg?st.audio.dur:0,
      aid: (voiceMsg && st.aid) ? st.aid : "", audio: (voiceMsg && !st.aid) ? await b64(st.audio.blob) : "" };
    const r = await fetch(CONFIG.ENDPOINT, {method:"POST", body:JSON.stringify(payload)});
    const j = await r.json(); if (!j.ok) throw new Error(j.error||"fail");
    clearTimeout(slowT); st.sent = true; sfx("sent"); fillSheet();
  }catch(e){
    clearTimeout(slowT); btn.disabled = false; btn.lastElementChild.textContent = t.send; status(t.fail, true);
  }
}

function openSheet(k,i,from){
  st = {k, i, when:-1, mode:"voice", text:"", name:"", phone:"", audio:null, sent:false, cita:null, cday:null};
  lastFocus = from || document.activeElement;
  fillSheet(); sheet.scrollTop = 0;
  root.classList.add("open"); document.documentElement.classList.add("lock");
  history.pushState({sheet:1}, "", location.search + "#mensaje");
  setTimeout(()=>sheet.focus({preventScroll:true}), 60);
}
function closeSheet(fromPop){
  if (!st) return;
  if (rec && rec.state==="recording") rec.stop();
  stopPlayer(); stopWave();
  root.classList.remove("open"); document.documentElement.classList.remove("lock");
  st = null;
  if (fromPop!==true && location.hash==="#mensaje") history.back();
  if (lastFocus) lastFocus.focus({preventScroll:true});
}
/* "Déjanos un mensaje": un toque abre la hoja como siempre; si lo mantienen pulsado, abre la hoja grabando
   y al soltar se escribe la nota (suena al terminar) y quedan listos el nombre y el contacto */
const leave = document.getElementById("leave");
let lvT = 0, lvHold = false;
leave.oncontextmenu = e=>e.preventDefault();
leave.onpointerdown = e=>{
  lvHold = false; clearTimeout(lvT);
  if (!canVoice() || e.button > 0) return;
  try{ leave.setPointerCapture(e.pointerId); }catch(_){}
  try{ const AC = window.AudioContext || window.webkitAudioContext; if (AC){ sfxCtx = sfxCtx || new AC(); if (sfxCtx.state === "suspended") sfxCtx.resume(); } }catch(_){}   // el sonido queda habilitado desde el toque
  lvT = setTimeout(()=>{ lvHold = true; openSheet(null, null, leave); held = true; pressT = Date.now(); sfx("start"); startRec(); }, 380);
};
const leaveUp = ()=>{
  clearTimeout(lvT); if (!lvHold || !st) return;
  held = false; pressT = 0;
  if (rec && rec.state==="recording") rec.stop();   // si soltó antes de que arrancara el micrófono (p. ej. al dar permiso), sigue grabando y se para con un toque
};
leave.onpointerup = leaveUp; leave.onpointercancel = leaveUp;
leave.onclick = e=>{ if (lvHold){ lvHold = false; return; } openSheet(null, null, e.currentTarget); };
document.getElementById("scrim").onclick = closeSheet;
addEventListener("popstate", ()=>closeSheet(true));
addEventListener("keydown", e=>{ if (e.key==="Escape") closeSheet(); });
let y0 = null, dy = 0;
sheet.addEventListener("touchstart", e=>{ if (sheet.scrollTop<=0 && !e.target.closest("textarea,input,audio")) { y0 = e.touches[0].clientY; dy = 0; } }, {passive:true});
sheet.addEventListener("touchmove", e=>{ if (y0===null || matchMedia("(min-width:820px)").matches) return;
  dy = Math.max(0, e.touches[0].clientY - y0); if (dy>0){ sheet.style.transition="none"; sheet.style.transform=`translateY(${dy}px)`; } }, {passive:true});
sheet.addEventListener("touchend", ()=>{ if (y0===null) return; sheet.style.transition=""; sheet.style.transform=""; if (dy>110) closeSheet(); y0 = null; dy = 0; });

document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  lang = b.dataset.l; try{ localStorage.setItem("lang",lang); }catch(e){}
  const app = document.getElementById("app"); app.replaceWith(app.cloneNode(false)); render();
}));
if (location.hash==="#mensaje") history.replaceState(null,"",location.search);
render();
new MutationObserver(() => { const el = document.querySelector(".hot-c"); if (el && !el.dataset.auto) autoScrollChips(el); }).observe(document.body, {childList:true, subtree:true});
autoScrollChips(document.querySelector(".hot-c"));
if (qs.has("cita") && canPick()) { openSheet(null, null); st.when = 3; fillSheet(); }   // /go/?cita=1 abre directo "Apartar cita" (para compartir el link)
else if (qs.has("m")) openSheet(null, null);   // /go/?m=1 abre directo "Déjanos un mensaje" (lo usa la página principal)
else if (seg && qs.get("i")) { const i = hotIndex(seg, qs.get("i")); if (i > -1) openSheet(seg, i); }   // /go/?s=tech&i=lock abre ese servicio
</script>
